name: Build Windows screenshot tool

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish compressed self-contained single-file app
        run: >-
          dotnet publish ezScreenShot.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish
      - name: Show publish output
        shell: pwsh
        run: |
          Get-ChildItem publish -File | Select-Object Name, Length
      - name: Package
        run: Compress-Archive -Path publish/* -DestinationPath ezScreenShot-Windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezScreenShot-Windows-x64
          path: ezScreenShot-Windows-x64.zip
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ezScreenShot-Windows-x64.zip
